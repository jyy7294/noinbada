[project]
name = "trzip-x-google"
version = "0.1.0"
description = "X and Google Trends only trend intelligence engine"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.55,<2",
  "pykrx>=1.2.8,<2",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
