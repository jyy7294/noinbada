[project]
name = "trzip-x-google"
version = "0.1.0"
description = "X and Google Trends only trend intelligence engine"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.55,<2",
  "pykrx>=1.2.8,<2",
]

[project.optional-dependencies]
production = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pillow>=11,<13",
  "defusedxml>=0.7,<1",
]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=8,<9",
  "httpx>=0.28,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
