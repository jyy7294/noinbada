name: Hourly Korea trend collection

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trzip-hourly-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout application code
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Checkout live data branch
        uses: actions/checkout@v6
        with:
          ref: live-data
          path: live-data
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install collector
        run: pip install -e .

      - name: Collect and publish data files
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_KOREA_WOEID: "23424868"
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          TRZIP_DISABLE_USER_SECRET_BRIDGE: "1"
        run: python -m trzip.github_pipeline --output live-data --retention-days 104

      - name: Validate generated contract
        run: |
          python -m json.tool live-data/latest/intelligence.json > /dev/null
          python -m json.tool live-data/latest/metadata.json > /dev/null
          test "$(python -c "import json; print(json.load(open('live-data/latest/metadata.json', encoding='utf-8'))['collection']['trends_mcp_used'])")" = "False"

      - name: Commit changed live data
        working-directory: live-data
        run: |
          git config user.name "trzip-hourly-bot"
          git config user.email "trzip-hourly-bot@users.noreply.github.com"
          git add latest observations
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "data: hourly collection $(date -u +'%Y-%m-%dT%H:00Z')"
          git push origin live-data
