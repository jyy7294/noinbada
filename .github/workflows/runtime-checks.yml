name: TR ZIP checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            deploy/requirements.lock.txt
      - run: python -m pip install -r deploy/requirements.lock.txt -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m compileall -q src/trzip/runtime
      - run: node --check web/app.js
      - run: git diff --check
