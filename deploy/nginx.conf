limit_req_zone $binary_remote_addr zone=trzip_api_limit:1m rate=10r/s;
server {
    listen 80;
    server_name trzip.62-171-141-206.sslip.io;
    client_max_body_size 16k;
    access_log off;
    error_log /var/log/nginx/trzip-error.log warn;
    location /.well-known/acme-challenge/ { root /srv/services/trzip/acme; }
    location / {
        limit_req zone=trzip_api_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:8448;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 15s;
    }
}
